[package]
name = "paper2codes"
version = "0.1.0"
edition = "2021"
authors = ["Paper2Codes Contributors"]
description = "A neuro-symbolic RAG framework for automated code generation from scientific literature"
license = "MIT"
repository = "https://github.com/yourusername/Paper2Codes"
homepage = "https://github.com/yourusername/Paper2Codes"
documentation = "https://docs.rs/paper2codes"
keywords = ["rag", "code-generation", "llm", "scientific-papers", "ai"]
categories = ["science", "development-tools", "artificial-intelligence"]
readme = "README.md"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# HTTP client
reqwest = { version = "0.11", features = ["json", "stream"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# CLI and UI
ratatui = "0.26"
crossterm = "0.28"
tui-textarea = "0.4"
clap = { version = "4.4", features = ["derive"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Document processing
pdf = "0.8"
regex = "1.10"
pulldown-cmark = "0.9"

# Code analysis
tree-sitter = "0.20"
tree-sitter-rust = "0.20"
tree-sitter-python = "0.20"

# Execution (optional - can be enabled via feature)
bollard = { version = "0.15", optional = true }

# Utilities
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
tempfile = "3.8"
walkdir = "2.4"
sha2 = "0.10"
async-trait = "0.1"
futures = "0.3"
futures-util = { version = "0.3", optional = true }

# Performance optimization
rayon = "1.8"
lru = "0.12"
num_cpus = "1.16"
sys-info = "0.9"
lazy_static = "1.4"
rand = "0.8"
base64 = "0.21"
md5 = "0.7"

# Configuration
config = "0.14"

# Database
surrealdb = { version = "1.5", features = ["kv-mem", "protocol-ws"] }
zip = { version = "0.6", default-features = false, features = ["deflate"] }

# HTTP server and API (optional, enabled by "api" feature)
axum = { version = "0.7", features = ["macros", "multipart", "ws"], optional = true }
tower = { version = "0.4", features = ["make"], optional = true }
tower-http = { version = "0.5", features = ["cors", "compression-gzip", "trace", "timeout", "set-header"], optional = true }
hyper = { version = "1.0", features = ["full"], optional = true }

# JWT authentication (optional, enabled by "api" feature)
jsonwebtoken = { version = "9.2", optional = true }

# Password hashing (optional, enabled by "api" feature)
argon2 = { version = "0.5", optional = true }

# Validation (optional, enabled by "api" feature)
validator = { version = "0.18", features = ["derive"], optional = true }

# Rate limiting (optional, enabled by "api" feature)
governor = { version = "0.6", optional = true }
dashmap = { version = "5.5", optional = true }

# WebSocket (optional, enabled by "api" feature)
tokio-tungstenite = { version = "0.21", optional = true }

# Prometheus metrics (optional, enabled by "api" feature)
prometheus = { version = "0.13", optional = true }

[dev-dependencies]
tokio-test = "0.4"
mockito = "1.2"
reqwest = { version = "0.11", features = ["json"] }

[features]
default = ["openrouter", "api"]
openrouter = []
openai = []
anthropic = []
xai = []
docker = ["bollard"]
z3 = []
api = ["axum", "tower", "tower-http", "hyper", "jsonwebtoken", "argon2", "validator", "governor", "dashmap", "tokio-tungstenite", "futures-util", "prometheus"]
legacy-tests = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
