global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'paper2codes'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []
          # - alertmanager:9093

# Load rules once and periodically evaluate them
rule_files:
  # - "alerts.yml"

# Scrape configurations
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Paper2Codes Core API
  - job_name: 'paper2codes-core'
    static_configs:
      - targets: ['core:8080']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  # SurrealDB (if it exposes metrics)
  - job_name: 'surrealdb'
    static_configs:
      - targets: ['surreal:8000']
    scrape_interval: 30s
    scrape_timeout: 10s

