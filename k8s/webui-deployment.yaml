apiVersion: apps/v1
kind: Deployment
metadata:
  name: paper2codes-webui
  namespace: paper2codes
  labels:
    app: paper2codes-webui
    component: frontend
spec:
  replicas: 2  # Start with 2 replicas for HA
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: paper2codes-webui
  template:
    metadata:
      labels:
        app: paper2codes-webui
        component: frontend
    spec:
      containers:
      - name: paper2codes-webui
        image: paper2codes/webui:latest  # Update with your registry
        imagePullPolicy: Always
        env:
        - name: NEXT_PUBLIC_API_URL
          value: "http://paper2codes-core:8080"
        - name: NEXT_PUBLIC_WS_URL
          value: "ws://paper2codes-core:8080/ws"
        - name: PORT
          value: "3000"
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: paper2codes-webui
  namespace: paper2codes
  labels:
    app: paper2codes-webui
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: paper2codes-webui

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: paper2codes-webui-hpa
  namespace: paper2codes
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: paper2codes-webui
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

