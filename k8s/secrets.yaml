apiVersion: v1
kind: Secret
metadata:
  name: paper2codes-secrets
  namespace: paper2codes
type: Opaque
stringData:
  # IMPORTANT: Replace these with actual values
  # In production, use external secrets management (AWS Secrets Manager, HashiCorp Vault)
  
  # LLM API Keys
  OPENROUTER_API_KEY: "sk-or-v1-REPLACE-ME"
  # OPENAI_API_KEY: "sk-REPLACE-ME"
  # ANTHROPIC_API_KEY: "sk-ant-REPLACE-ME"
  
  # Database Password
  DATABASE_PASS: "REPLACE-WITH-SECURE-PASSWORD"
  
  # JWT Secret
  JWT_SECRET_KEY: "REPLACE-WITH-SECURE-RANDOM-STRING"
  
  # GitHub Token (optional)
  GITHUB_TOKEN: ""
  
  # Sentry DSN (optional)
  SENTRY_DSN: ""

---
# Note: This file should NOT be committed to version control in production
# Use kubectl create secret or external secrets management instead

