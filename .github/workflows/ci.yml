name: CI

# Runs the validated offline test suite — engine build + unit/integration tests
# + the offline benchmark (no API keys), and the Web UI type-check + Playwright
# e2e (backend mocked). Mirrors `scripts/e2e-smoke.sh`.

on:
  push:
    branches: [main, develop, 'claude/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (informational)
    runs-on: ubuntu-latest
    # Reports rustfmt/clippy findings without blocking the build (the codebase
    # predates a clean fmt/clippy pass; tighten to required once it is green).
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Paper2Codes-Core
      - name: rustfmt
        continue-on-error: true
        working-directory: Paper2Codes-Core
        run: cargo fmt --all -- --check
      - name: clippy
        continue-on-error: true
        working-directory: Paper2Codes-Core
        run: cargo clippy --all-targets

  core:
    name: Engine (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: Paper2Codes-Core

      - name: Build
        working-directory: Paper2Codes-Core
        run: cargo build --verbose

      - name: Unit + integration tests
        working-directory: Paper2Codes-Core
        run: cargo test --lib --test e2e_pipeline --test skills_e2e --test tui_render

      - name: Offline benchmark (no API keys)
        working-directory: Paper2Codes-Core
        run: cargo run -- bench --manifest bench/dataset/manifest.json --offline

  webui:
    name: Web UI (Next.js + Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Paper2Codes-WebUI
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: Paper2Codes-WebUI/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: npx tsc --noEmit -p tsconfig.json

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Playwright e2e tests
        run: pnpm test:e2e
