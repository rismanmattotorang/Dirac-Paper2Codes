name: Frontend CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'Paper2Codes-WebUI/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'Paper2Codes-WebUI/**'
      - '.github/workflows/frontend.yml'

env:
  NODE_VERSION: '20'

jobs:
  # Lint and Format Check
  lint:
    name: Lint and Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.40.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: Paper2Codes-WebUI/package-lock.json

      - name: Install dependencies
        working-directory: Paper2Codes-WebUI
        run: npm ci

      - name: Deno format check
        working-directory: Paper2Codes-WebUI
        run: deno task fmt:check || echo "Format check skipped (no deno.json tasks defined)"

      - name: Deno lint
        working-directory: Paper2Codes-WebUI
        run: deno task lint || echo "Lint check skipped (no deno.json tasks defined)"

      - name: ESLint
        working-directory: Paper2Codes-WebUI
        run: npm run lint || echo "ESLint check skipped"

  # Type Check
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.40.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: Paper2Codes-WebUI/package-lock.json

      - name: Install dependencies
        working-directory: Paper2Codes-WebUI
        run: npm ci

      - name: TypeScript type check
        working-directory: Paper2Codes-WebUI
        run: npm run typecheck || npx tsc --noEmit

  # Build
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: Paper2Codes-WebUI/package-lock.json

      - name: Install dependencies
        working-directory: Paper2Codes-WebUI
        run: npm ci

      - name: Build Next.js application
        working-directory: Paper2Codes-WebUI
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
          NEXT_PUBLIC_WS_URL: ws://localhost:8080/ws
          NEXT_PUBLIC_ENABLE_ANALYTICS: 'true'
          NEXT_PUBLIC_ENABLE_REAL_TIME: 'true'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: nextjs-build
          path: Paper2Codes-WebUI/.next
          retention-days: 7

  # Test
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: Paper2Codes-WebUI/package-lock.json

      - name: Install dependencies
        working-directory: Paper2Codes-WebUI
        run: npm ci

      - name: Run tests
        working-directory: Paper2Codes-WebUI
        run: npm test -- --run || echo "Tests skipped (no test script defined)"

  # Security Audit
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: Paper2Codes-WebUI/package-lock.json

      - name: Install dependencies
        working-directory: Paper2Codes-WebUI
        run: npm ci

      - name: Run npm audit
        working-directory: Paper2Codes-WebUI
        run: npm audit --audit-level=moderate || true

  # Docker Build
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [build, test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub (if needed)
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: paper2codes/webui
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./Paper2Codes-WebUI
          file: ./Paper2Codes-WebUI/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy (placeholder - customize based on your deployment target)
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://paper2codes.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to production
        run: |
          echo "Deployment steps would go here"
          # Example: kubectl apply, terraform apply, etc.
          # This is a placeholder - customize based on your deployment target

