name: Integration Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      surreal:
        image: surrealdb/surrealdb:latest
        ports:
          - 8000:8000
        options: >-
          --health-cmd "curl -f http://localhost:8000/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        env:
          SURREAL_USER: root
          SURREAL_PASS: root

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Cache Cargo dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            Paper2Codes-Core/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build with API features
        working-directory: Paper2Codes-Core
        run: cargo build --release --features api

      - name: Run integration tests
        working-directory: Paper2Codes-Core
        run: cargo test --all-features --test integration
        env:
          RUST_LOG: info
          DATABASE_URL: ws://localhost:8000
          DATABASE_NAMESPACE: test
          DATABASE_NAME: test
          DATABASE_USER: root
          DATABASE_PASS: root

