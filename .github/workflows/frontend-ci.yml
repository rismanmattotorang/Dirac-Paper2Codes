name: Frontend CI/CD

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'Paper2Codes-WebUI/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'Paper2Codes-WebUI/**'

env:
  NODE_VERSION: '18'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/webui

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: Paper2Codes-WebUI/package-lock.json
      
      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x
      
      - name: Install dependencies
        working-directory: ./Paper2Codes-WebUI
        run: npm ci
      
      - name: Run Deno lint
        working-directory: ./Paper2Codes-WebUI
        run: deno lint
      
      - name: Run Deno format check
        working-directory: ./Paper2Codes-WebUI
        run: deno fmt --check
      
      - name: Type check
        working-directory: ./Paper2Codes-WebUI
        run: npm run typecheck || true  # Don't fail on type errors for now

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: Paper2Codes-WebUI/package-lock.json
      
      - name: Install dependencies
        working-directory: ./Paper2Codes-WebUI
        run: npm ci
      
      - name: Run tests
        working-directory: ./Paper2Codes-WebUI
        run: npm test || echo "No tests configured yet"
      
      - name: Generate coverage
        if: github.event_name == 'push'
        working-directory: ./Paper2Codes-WebUI
        run: npm run test:coverage || echo "No coverage configured yet"
      
      - name: Upload coverage to Codecov
        if: github.event_name == 'push'
        uses: codecov/codecov-action@v3
        with:
          files: ./Paper2Codes-WebUI/coverage/coverage-final.json
          flags: frontend

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Run npm audit
        working-directory: ./Paper2Codes-WebUI
        run: npm audit --production || true

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test, security]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: Paper2Codes-WebUI/package-lock.json
      
      - name: Install dependencies
        working-directory: ./Paper2Codes-WebUI
        run: npm ci
      
      - name: Build
        working-directory: ./Paper2Codes-WebUI
        env:
          NEXT_PUBLIC_API_URL: https://api.paper2codes.example.com
          NEXT_PUBLIC_WS_URL: wss://api.paper2codes.example.com/ws
        run: npm run build
      
      - name: Upload build artifact
        uses: actions/upload-artifact@v3
        with:
          name: paper2codes-webui
          path: Paper2Codes-WebUI/.next

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./Paper2Codes-WebUI
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://staging.paper2codes.example.com
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
      
      - name: Configure kubectl
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG_STAGING }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG" | base64 -d > ~/.kube/config
      
      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/paper2codes-webui \
            paper2codes-webui=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:develop-${{ github.sha }} \
            -n paper2codes
          kubectl rollout status deployment/paper2codes-webui -n paper2codes

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://paper2codes.example.com
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
      
      - name: Configure kubectl
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG_PRODUCTION }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG" | base64 -d > ~/.kube/config
      
      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/paper2codes-webui \
            paper2codes-webui=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main-${{ github.sha }} \
            -n paper2codes
          kubectl rollout status deployment/paper2codes-webui -n paper2codes
      
      - name: Verify deployment
        run: |
          kubectl get pods -n paper2codes
          kubectl get services -n paper2codes

